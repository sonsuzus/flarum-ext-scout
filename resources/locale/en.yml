clarkwinkelmann-scout:
  admin:
    setting:
      driver: Driver
      driverOption:
        null: "Null"
        algolia: Algolia
        meilisearch: Meilisearch
        tntsearch: TNTSearch
      prefix: Index name prefix (optional)
      queue: Process index updates in queue
      queueHelp: This setting only has an effect if an asynchronous queue driver is configured in Flarum.
      limit: Default Results Limit
      limitPlaceholder: Auto
      limitHelp: This will override the number of results requested from the search engine and influence how many pages of results can be generated (the limit includes non-visible content).
      queryMinLength: Minimum Query Length for Suggestions
      queryMinLengthPlaceholder: Auto (3)
      queryMinLengthHelp: This setting only affects the search input dropdown in the header. Full search results always work with any query length. Refresh the page after changing this value.
      rankingStrategy: Discussion Ranking Strategy
      rankingStrategyHelp: Controls how matches in discussion titles vs posts are prioritized and combined.
      rankingStrategyOption:
        default: Default (Title & Posts weighted)
        exact_title_post: Exact Title, then Posts
        posts_only: Posts Only
        title_first: Title First, then Posts
        title_only: Title Only
      algoliaId: Algolia ID
      algoliaSecret: Algolia Secret
      algoliaConnectTimeout: Algolia Connect Timeout (optional)
      algoliaReadTimeout: Algolia Read Timeout (optional)
      algoliaWriteTimeout: Algolia Write Timeout (optional)
      meilisearchHost: Meilisearch Host (optional)
      meilisearchKey: Meilisearch Key (optional)
      tntsearchMaxDocs: TNTSearch Max Docs (optional, max results)
      tntsearchFuzziness: TNTSearch Fuzziness (typo matching)
      tntsearchFuzzyDistance: TNTSearch Fuzziness Levenshtein Distance (optional)
      tntsearchFuzzyPrefixLength: TNTSearch Fuzziness Prefix Length (optional)
      tntsearchFuzzyMaxExpansions: TNTSearch Fuzziness Max Expansions (optional)